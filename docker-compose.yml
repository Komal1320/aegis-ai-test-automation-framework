services:
  nopcommerce:
    image: nopcommerceteam/nopcommerce:5.00.0
    container_name: aegis-nopcommerce
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: aegis-postgres
    environment:
      POSTGRES_DB: nopcommerce
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d nopcommerce"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
